name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Unit tests (node --test, no network)
        run: npm test
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.332
      - name: Validate the marketplace
        run: claude plugin validate .
      - name: Validate the sapp-brand plugin
        run: claude plugin validate plugins/sapp-brand
